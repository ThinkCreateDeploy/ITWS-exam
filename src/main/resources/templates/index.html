<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recipe Box</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
</head>
<body>

<header class="page-header">
    <h1 class="logo">
        <img th:src="@{/recipe_overflow.svg}" alt="Recipe Box logo" class="logo-icon"/>
        Recipe Box
    </h1>
    <p class="subtitle">My personal collection of recipes and ingredients</p>
</header>

<main class="container">

    <section class="panel">
        <div class="panel-header">
            <h2>Add a new recipe</h2>
        </div>
        <div id="recipe-form-container">
            <div th:replace="~{fragments/recipe-fragments :: newButton}"></div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>All recipes</h2>
        </div>
        <div id="recipe-list" class="recipe-grid">
            <div th:replace="~{fragments/recipe-fragments :: list}"></div>
        </div>
    </section>

</main>

</body>
</html>
